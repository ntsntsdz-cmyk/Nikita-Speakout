<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikita Speakout - Course Dashboard</title>
    <style>
        :root {
            --primary-color: #2da44e; /* GitHub style green */
            --text-color: #24292f;
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --border-color: #d0d7de;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        p {
            color: #57606a;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .lesson-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lesson-item {
            margin-bottom: 12px;
        }

        .lesson-link {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .lesson-link:hover {
            background-color: #f0f2f5;
            border-color: #0969da;
            transform: translateY(-1px);
        }

        .icon {
            margin-right: 12px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nikita Speakout</h1>
        <p>Select a lesson from the list below to begin:</p>

        <ul class="lesson-list">
            <!-- Your first connected file -->
            <li class="lesson-item">
                <a class="lesson-link" href="1A.html">
                    <span class="icon">📝</span> Lesson 1A
                </a>
            </li>

            <!-- To add a new file later, copy the lines below, paste them right here, and change the filename -->
            <!-- 
            <li class="lesson-item">
                <a class="lesson-link" href="2A.html">
                    <span class="icon">📝</span> Lesson 2A
                </a>
            </li> 
            -->
        </ul>
    </div>

</body>
</html>
